<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
  <style>
    .t { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 15px; fill: #c9d1d9; white-space: pre; }
    .g { fill: #00ff41; }
    .d { fill: #6e7681; }
    .r { fill: #ff5f56; }
    .y { fill: #ffbd2e; }
    .b { font-weight: 700; }
    .l { opacity: 0; animation: in .01s linear forwards; }
    @keyframes in { to { opacity: 1; } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scan { animation: sweep 3s linear infinite; }
    @keyframes sweep { from { transform: translateY(40px); } to { transform: translateY(400px); } }
  </style>

